<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kamissa — Connexion, direction Racines</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="min-height: 1100px; position: relative; background: #fdfcf9; color: #12110e; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: flex; flex-wrap: wrap;">

  <section aria-hidden="true" style="flex: 999 1 640px; min-width: 0; position: relative; min-height: 600px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px; box-sizing: border-box; border-right: 1px solid #e4dfd4;">
    <div style="position: absolute; left: 8%; top: 12%; width: 180px; height: 130px; background: linear-gradient(135deg, #5a7580, #3f5761);"></div>
    <div style="position: absolute; right: 10%; top: 8%; width: 120px; height: 160px; background: linear-gradient(135deg, #cb9a56, #a87b3e);"></div>
    <div style="position: absolute; left: 14%; bottom: 14%; width: 140px; height: 180px; background: linear-gradient(135deg, #5f8763, #46684a);"></div>
    <div style="position: absolute; right: 6%; bottom: 20%; width: 200px; height: 140px; background: linear-gradient(135deg, #a3867d, #86695f);"></div>
    <div style="position: absolute; left: 46%; top: 70%; width: 90px; height: 70px; background: linear-gradient(135deg, #337c83, #245d63);"></div>
    <div style="position: relative; display: flex; gap: 8px; margin-bottom: 24px;"><span style="width: 14px; height: 14px; background: #cb9a56;"></span><span style="width: 14px; height: 14px; background: #5f8763;"></span><span style="width: 14px; height: 14px; background: #5a7580;"></span></div>
    <p style="position: relative; margin: 0; font-family: 'Instrument Serif', serif; font-size: 190px; line-height: 0.82; text-transform: uppercase;">Kamissa</p>
    <p style="position: relative; margin: 10px 0 0; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 52px;">L'art partout, tout le temps.</p>
    <p style="position: relative; margin: 22px 0 0; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #6e6a61;">( Paris · Athènes )</p>
  </section>

  <main style="flex: 1 1 420px; max-width: 520px; box-sizing: border-box; padding: 64px 56px; display: flex; flex-direction: column; justify-content: center;">
    <div role="tablist" aria-label="Connexion ou inscription" style="display: flex; gap: 32px; padding-bottom: 18px; border-bottom: 1px solid #12110e;">
      <button role="tab" aria-selected="{{ loginSel }}" onClick="{{ showLogin }}" style="{{ loginTab }}">Connexion</button>
      <button role="tab" aria-selected="{{ signupSel }}" onClick="{{ showSignup }}" style="{{ signupTab }}">Inscription</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 22px; margin-top: 32px;">
      <sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label for="a-nom" style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #6e6a61;">Nom</label>
          <input id="a-nom" placeholder="Nom" style="min-height: 48px; border: 0; border-bottom: 1px solid #12110e; background: transparent; font-family: 'Instrument Serif', serif; font-size: 26px; color: #12110e;" />
        </div>
      </sc-if>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label for="a-email" style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #6e6a61;">Email</label>
        <input id="a-email" type="email" placeholder="Email" style="min-height: 48px; border: 0; border-bottom: 1px solid #12110e; background: transparent; font-family: 'Instrument Serif', serif; font-size: 26px; color: #12110e;" />
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label for="a-mdp" style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #6e6a61;">Mot de passe</label>
        <input id="a-mdp" type="password" placeholder="Mot de passe" style="min-height: 48px; border: 0; border-bottom: 1px solid #12110e; background: transparent; font-family: 'Instrument Serif', serif; font-size: 26px; color: #12110e;" />
      </div>
      <button onClick="{{ submit }}" style="margin-top: 12px; min-height: 56px; border-radius: 999px; border: 0; background: #12110e; color: #fdfcf9; font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">{{ submitLabel }}</button>
    </div>
  </main>

  <sc-if value="{{ showWelcome }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(18,17,14,.45); display: flex; align-items: center; justify-content: center; padding: 24px;">
      <div role="dialog" aria-modal="true" aria-labelledby="w-title" style="width: 100%; max-width: 560px; box-sizing: border-box; background: #fdfcf9; padding: 48px 48px 40px; text-align: center; box-shadow: 0 30px 80px rgba(18,17,14,.3);">
        <div aria-hidden="true" style="display: flex; justify-content: center; gap: 6px;"><span style="width: 10px; height: 10px; background: #cb9a56;"></span><span style="width: 10px; height: 10px; background: #5f8763;"></span><span style="width: 10px; height: 10px; background: #5a7580;"></span></div>
        <h2 id="w-title" style="margin: 22px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 56px; line-height: 0.95;">Bienvenue <em>chez Kamissa !</em></h2>
        <p style="margin: 18px 0 0; font-size: 15px; line-height: 1.6; color: #3d3a34;">Découvrez les événements et boutiques près de vous, rejoignez la Communauté à Paris et à Athènes, et complétez votre profil pour être visible des autres artistes.</p>
        <a href="Accueil-Racines.dc.html" style="display: inline-flex; align-items: center; justify-content: center; margin-top: 28px; min-height: 52px; padding: 0 36px; border-radius: 999px; background: #12110e; color: #fdfcf9; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none;">Commencer</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  state = { view: 'login', welcome: false };
  renderVals() {
    const st = this.state;
    const tab = (a) => ({ minHeight: '44px', border: 0, padding: 0, background: 'transparent', cursor: 'pointer', fontFamily: "'Instrument Serif', serif", fontSize: '40px', fontStyle: a ? 'italic' : 'normal', color: a ? '#12110e' : '#8f8a7f', textDecoration: a ? 'underline' : 'none', textUnderlineOffset: '8px', textDecorationThickness: '1px' });
    const signup = st.view === 'signup';
    return {
      isSignup: signup,
      loginSel: String(!signup), signupSel: String(signup),
      loginTab: tab(!signup), signupTab: tab(signup),
      showLogin: () => this.setState({ view: 'login' }),
      showSignup: () => this.setState({ view: 'signup' }),
      submitLabel: signup ? 'Créer mon compte' : 'Se connecter',
      submit: () => { if (signup) this.setState({ welcome: true }); },
      showWelcome: st.welcome
    };
  }
}
</script>
</body>
</html>
