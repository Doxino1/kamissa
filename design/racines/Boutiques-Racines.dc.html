<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kamissa — Boutiques, direction Racines</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="min-height: 1100px; position: relative; background: #fdfcf9; color: #12110e; font-family: 'Hanken Grotesk', system-ui, sans-serif;">

  <header style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 24px; padding: 24px 40px;">
    <nav aria-label="Navigation principale" style="display: flex; flex-wrap: wrap; gap: 28px;">
      <a href="Accueil-Racines.dc.html" style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #12110e; text-decoration: none;">Événements</a>
      <a href="Communaute-Racines.dc.html" style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #12110e; text-decoration: none;">Communauté</a>
      <a href="Calendrier-Racines.dc.html" style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #12110e; text-decoration: none;">Calendrier</a>
    </nav>
    <a href="Accueil-Racines.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: #12110e;">
      <span style="font-family: 'Instrument Serif', serif; font-size: 30px; line-height: 1;">Kamissa</span>
      <span aria-hidden="true" style="display: flex; gap: 5px;"><span style="width: 8px; height: 8px; background: #cb9a56;"></span><span style="width: 8px; height: 8px; background: #5f8763;"></span><span style="width: 8px; height: 8px; background: #5a7580;"></span></span>
    </a>
    <div style="display: flex; justify-content: flex-end; gap: 10px;">
      <button aria-label="Notifications" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #e4dfd4; background: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#12110e" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
      <a href="#" aria-current="page" aria-label="Boutiques" style="width: 44px; height: 44px; border-radius: 999px; background: #12110e; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fdfcf9" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v7h14v-7"/></svg></a>
      <a href="Profil-Racines.dc.html" aria-label="Mon profil" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; border: 1px solid #e4dfd4; background: #ffffff; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#12110e" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></a>
    </div>
  </header>

  <section style="max-width: 1360px; margin: 0 auto; padding: 24px 40px 0; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; border-bottom: 1px solid #12110e;">
    <div style="padding-bottom: 18px;">
      <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 120px; line-height: 0.85; text-transform: uppercase;">Boutiques</h1>
      <p style="margin: 8px 0 0; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 36px;">le matériel, près de chez vous.</p>
    </div>
    <div style="display: flex; gap: 8px; padding-bottom: 24px;">
      <sc-for list="{{ cities }}" as="c" hint-placeholder-count="2"><button onClick="{{ c.pick }}" aria-pressed="{{ c.pressed }}" style="{{ c.style }}">{{ c.label }}</button></sc-for>
    </div>
  </section>

  <section aria-label="Recherche et catégories" style="max-width: 1360px; margin: 0 auto; padding: 18px 40px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; border-bottom: 1px solid #e4dfd4;">
    <label style="flex: 1 1 280px; display: flex; align-items: center; gap: 10px; min-height: 44px; border-bottom: 1px solid #12110e;">
      <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#12110e" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input placeholder="Rechercher une boutique..." aria-label="Rechercher une boutique" style="flex: 1; border: 0; background: transparent; font-family: 'Instrument Serif', serif; font-size: 24px; color: #12110e;" />
    </label>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <sc-for list="{{ cats }}" as="c" hint-placeholder-count="4"><button onClick="{{ c.pick }}" aria-pressed="{{ c.pressed }}" style="{{ c.style }}">{{ c.label }}</button></sc-for>
    </div>
  </section>

  <main style="max-width: 1360px; margin: 0 auto; padding: 0 40px 40px; display: flex; flex-wrap: wrap; gap: 32px;">
    <div style="flex: 1 1 480px; max-width: 600px; min-width: 0;">
      <sc-for list="{{ shops }}" as="s" hint-placeholder-count="4">
        <article onMouseEnter="{{ s.enter }}" onMouseLeave="{{ s.leave }}" style="{{ s.card }}">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
            <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;"><span style="font-weight: 400; color: #6e6a61;">( 0{{ s.n }} )</span><span aria-hidden="true" style="{{ s.square }}"></span>{{ s.category }}</span>
          </div>
          <h2 style="margin: 10px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 34px; line-height: 1.05;">{{ s.name }}</h2>
          <p style="margin: 6px 0 0; font-size: 13px; letter-spacing: 0.04em; color: #6e6a61;">{{ s.address }}</p>
          <p style="margin: 8px 0 0; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 21px; line-height: 1.25;">{{ s.description }}</p>
          <div style="display: flex; align-items: center; gap: 18px; margin-top: 14px;">
            <sc-if value="{{ s.hasLink }}" hint-placeholder-val="{{ false }}">
              <a href="{{ s.link }}" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 18px; border-radius: 999px; background: #12110e; color: #fdfcf9; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none;">Site web ↗</a>
            </sc-if>
            <button style="min-height: 40px; border: 0; padding: 0; background: transparent; font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: underline; text-underline-offset: 4px; cursor: pointer;">Partager</button>
            <button style="min-height: 40px; border: 0; padding: 0; background: transparent; font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #9e3a1e; cursor: pointer;">Supprimer</button>
          </div>
        </article>
      </sc-for>
    </div>

    <div aria-label="Carte des boutiques" role="img" style="flex: 999 1 420px; min-width: 0; position: relative; min-height: 640px; margin-top: 24px; background: #efeadf; overflow: hidden;">
      <svg aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%;">
        <path d="M0 55 C 15 45, 25 60, 40 52 S 60 35, 72 48 S 90 70, 100 62" fill="none" stroke="#c9d3d6" stroke-width="3.2"/>
        <path d="M0 20 L100 34 M12 0 L30 100 M55 0 L48 100 M0 82 L100 76 M78 0 L92 100" fill="none" stroke="#e2dccf" stroke-width="0.5"/>
      </svg>
      <sc-for list="{{ shops }}" as="s" hint-placeholder-count="4">
        <span style="{{ s.pin }}">{{ s.n }}</span>
      </sc-for>
      <p style="position: absolute; left: 20px; bottom: 16px; margin: 0; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6e6a61;">( {{ cityName }} )</p>
    </div>
  </main>

  <a href="Modale-Boutique-Racines.dc.html" style="position: absolute; right: 40px; bottom: 32px; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 26px; border-radius: 999px; background: #12110e; color: #fdfcf9; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none;"><span style="font-size: 20px;">+</span> Ajouter une boutique</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
const SHOPS = [
  { id: 1, name: 'ADAM Montparnasse', category: 'Pluridisciplinaire', city: 'paris', address: '11 Boulevard Edgar Quinet, 75014 Paris', description: 'Fournitures pour beaux-arts depuis 1898, couleurs et produits fabriqués artisanalement.', link: 'https://www.adamparis.com/', lat: 48.840, lng: 2.326 },
  { id: 2, name: 'Terre & Feu', category: 'Céramique', city: 'paris', address: '48 rue de Belleville, 75020 Paris', description: 'Argiles, émaux et outillage céramique.', link: '', lat: 48.872, lng: 2.383 },
  { id: 3, name: 'Sennelier', category: 'Peinture', city: 'paris', address: '3 quai Voltaire, 75007 Paris', description: 'Pigments, pastels et couleurs extra-fines depuis 1887.', link: '', lat: 48.858, lng: 2.328 },
  { id: 4, name: 'Rougier & Plé', category: 'Pluridisciplinaire', city: 'paris', address: '13-15 boulevard des Filles du Calvaire, 75003 Paris', description: 'Grand choix de matériel pour toutes les disciplines artistiques.', link: '', lat: 48.863, lng: 2.365 },
  { id: 5, name: 'Techni Chromatiki', category: 'Peinture', city: 'athens', address: '22 Ermou, Athènes', description: 'Pigments et toiles pour peintres.', link: '', lat: 37.976, lng: 23.727 },
  { id: 6, name: 'Keramio', category: 'Céramique', city: 'athens', address: '9 Melitonos, Athènes', description: 'Argiles, fours et outillage pour céramistes.', link: '', lat: 37.9718, lng: 23.7185 },
  { id: 7, name: 'Chartopoleio Karagiannis', category: 'Papeterie', city: 'athens', address: '15 Stadiou, Athènes', description: 'Papiers d’art, reliure et fournitures de gravure.', link: '', lat: 37.9795, lng: 23.7332 }
];
const BOX = { paris: [2.29, 2.41, 48.880, 48.835], athens: [23.712, 23.742, 37.985, 37.966] };
const CAT = { 'Pluridisciplinaire': '#5a7580', 'Céramique': '#cb9a56', 'Peinture': '#a3867d', 'Papeterie': '#5f8763' };
class Component extends DCLogic {
  state = { city: 'paris', cat: 'Tous', hover: null };
  renderVals() {
    const st = this.state;
    const pill = (a) => ({ minHeight: '40px', padding: '0 16px', borderRadius: '999px', border: a ? '1px solid #12110e' : '1px solid #e4dfd4', background: a ? '#12110e' : 'transparent', color: a ? '#fdfcf9' : '#12110e', fontFamily: 'inherit', fontSize: '12px', fontWeight: 600, letterSpacing: '0.08em', textTransform: 'uppercase', cursor: 'pointer' });
    const inCity = SHOPS.filter(s => s.city === st.city);
    const catList = ['Tous', ...Array.from(new Set(inCity.map(s => s.category)))];
    const b = BOX[st.city];
    const list = inCity.filter(s => st.cat === 'Tous' || s.category === st.cat);
    return {
      cityName: st.city === 'paris' ? 'Paris' : 'Athènes',
      cities: [['paris', 'Paris'], ['athens', 'Athènes']].map(([v, l]) => ({ label: l, pressed: String(st.city === v), style: pill(st.city === v), pick: () => this.setState({ city: v, cat: 'Tous' }) })),
      cats: catList.map(c => ({ label: c, pressed: String(st.cat === c), style: pill(st.cat === c), pick: () => this.setState({ cat: c }) })),
      shops: list.map((s, i) => {
        const h = st.hover === s.id;
        return { ...s, n: i + 1, hasLink: !!s.link,
          card: { padding: '24px 0', borderBottom: '1px solid #e4dfd4', background: h ? '#f6f2ea' : 'transparent', transition: 'background .15s' },
          square: { width: '9px', height: '9px', background: CAT[s.category] },
          enter: () => this.setState({ hover: s.id }), leave: () => this.setState({ hover: null }),
          pin: { position: 'absolute', left: ((s.lng - b[0]) / (b[1] - b[0]) * 100) + '%', top: ((b[2] - s.lat) / (b[2] - b[3]) * 100) + '%', transform: `translate(-50%, -50%) scale(${h ? 1.35 : 1})`, width: '34px', height: '34px', background: CAT[s.category], color: '#ffffff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: "'Instrument Serif', serif", fontSize: '20px', border: '3px solid #fdfcf9', transition: 'transform .15s' }
        };
      })
    };
  }
}
</script>
</body>
</html>
