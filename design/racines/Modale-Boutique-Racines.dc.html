<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kamissa — Ajouter une boutique, direction Racines</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="min-height: 1100px; position: relative; background: #fdfcf9; color: #12110e; font-family: 'Hanken Grotesk', system-ui, sans-serif; overflow: hidden;">
  <div aria-hidden="true" style="padding: 120px 40px 0; max-width: 1360px; margin: 0 auto;">
    <p style="margin: 0; font-family: 'Instrument Serif', serif; font-size: 120px; line-height: 0.85; text-transform: uppercase;">Boutiques</p>
    <div style="margin-top: 60px; display: flex; gap: 32px;"><div style="flex: 1; height: 640px; border-top: 1px solid #12110e;"></div><div style="flex: 1.3; height: 640px; background: #efeadf;"></div></div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(18,17,14,.45); display: flex; align-items: center; justify-content: center; padding: 24px;">
    <div role="dialog" aria-modal="true" aria-labelledby="sh-title" style="width: 100%; max-width: 640px; box-sizing: border-box; background: #fdfcf9; padding: 36px 44px 40px; box-shadow: 0 30px 80px rgba(18,17,14,.3);">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid #12110e;">
        <div>
          <p style="margin: 0; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #6e6a61;">( Nouvelle adresse )</p>
          <h2 id="sh-title" style="margin: 6px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 48px; line-height: 0.95;">Ajouter <em>une boutique</em></h2>
        </div>
        <a href="Boutiques-Racines.dc.html" aria-label="Fermer" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #e4dfd4; display: flex; align-items: center; justify-content: center; color: #12110e; text-decoration: none; font-size: 16px;">✕</a>
      </div>

      <div style="display: flex; flex-direction: column; gap: 18px; margin-top: 22px;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label for="sh-n" style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #6e6a61;">Nom</label>
          <input id="sh-n" value="{{ name }}" onChange="{{ onName }}" placeholder="Nom" aria-invalid="{{ invalid }}" aria-describedby="sh-err" style="{{ nameStyle }}" />
          <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
            <p id="sh-err" style="margin: 4px 0 0; font-size: 13px; font-weight: 600; color: #9e3a1e;">Le nom de la boutique est requis.</p>
          </sc-if>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px;">
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <label for="sh-v" style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #6e6a61;">Ville</label>
            <select id="sh-v" style="min-height: 46px; border: 0; border-bottom: 1px solid #12110e; background: transparent; font-family: 'Instrument Serif', serif; font-size: 24px; color: #12110e;"><option value="paris">Paris</option><option value="athens">Athènes</option></select>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <label for="sh-c" style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #6e6a61;">Catégorie</label>
            <select id="sh-c" style="min-height: 46px; border: 0; border-bottom: 1px solid #12110e; background: transparent; font-family: 'Instrument Serif', serif; font-size: 24px; color: #12110e;"><option>Peinture</option><option>Céramique</option><option>Papeterie</option><option>Sculpture</option><option>Pluridisciplinaire</option></select>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label for="sh-a" style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #6e6a61;">Adresse</label>
          <input id="sh-a" placeholder="Adresse" style="min-height: 46px; border: 0; border-bottom: 1px solid #12110e; background: transparent; font-family: 'Instrument Serif', serif; font-size: 24px; color: #12110e;" />
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label for="sh-d" style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #6e6a61;">Description</label>
          <textarea id="sh-d" placeholder="Description" rows="3" style="border: 1px solid #e4dfd4; background: transparent; padding: 10px 12px; font-family: 'Instrument Serif', serif; font-size: 22px; color: #12110e; resize: vertical;"></textarea>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label for="sh-l" style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #6e6a61;">Lien</label>
          <input id="sh-l" type="url" placeholder="Lien" style="min-height: 46px; border: 0; border-bottom: 1px solid #12110e; background: transparent; font-family: 'Instrument Serif', serif; font-size: 24px; color: #12110e;" />
        </div>
        <button onClick="{{ submit }}" style="margin-top: 8px; min-height: 56px; border-radius: 999px; border: 0; background: #12110e; color: #fdfcf9; font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">Ajouter</button>
      </div>
    </div>
  </div>

  <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
    <p role="status" style="position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); margin: 0; padding: 14px 26px; border-radius: 999px; background: #46684a; color: #ffffff; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;">Boutique ajoutée ✓</p>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  state = { name: '', error: false, toast: false };
  renderVals() {
    const st = this.state;
    return {
      name: st.name, hasError: st.error, invalid: String(st.error), toast: st.toast,
      onName: (e) => this.setState({ name: e.target.value, error: false }),
      nameStyle: { minHeight: '46px', border: 0, borderBottom: st.error ? '2px solid #9e3a1e' : '1px solid #12110e', background: 'transparent', fontFamily: "'Instrument Serif', serif", fontSize: '24px', color: '#12110e' },
      submit: () => { if (!st.name.trim()) this.setState({ error: true, toast: false }); else this.setState({ toast: true, error: false }); }
    };
  }
}
</script>
</body>
</html>
